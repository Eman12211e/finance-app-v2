<body>
  <header class="app-header">
    <h1 class="brand">Money Basics</h1>
    <nav class="tabs" aria-label="Sections">
      <button type="button" class="tab" data-tab="explore" aria-pressed="true">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg>
        <span class="tab-label">Explore</span><span class="tab-short" aria-hidden="true">Explore</span>
      </button>
      <button type="button" class="tab" data-tab="lab" aria-pressed="false">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>

      <button type="button" class="tab" data-tab="sign" aria-pressed="false">

      </button>
      <button type="button" class="tab" data-tab="paper" aria-pressed="false">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 17l5-5 4 3 8-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15 7h5v5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span class="tab-label">Practice Trading</span><span class="tab-short" aria-hidden="true">Practice</span>
      </button>
    </nav>
    <div class="header-actions">
      <div id="alerts-root"></div>
      <div class="learn">
        <button id="learn-button" type="button" class="button-secondary" aria-haspopup="true" aria-expanded="false" aria-controls="learn-menu">Learn
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
        <ul id="learn-menu" class="learn-menu" role="menu" aria-labelledby="learn-button" hidden>
          <li role="none"><button id="checklist-open" type="button" role="menuitem" class="menu-item">Before you buy</button></li>
          <li role="none"><button id="accounts-open" type="button" role="menuitem" class="menu-item">Learn about accounts</button></li>
          <li role="none"><button id="sentiment-open" type="button" role="menuitem" class="menu-item" hidden>Sentiment</button></li>
        </ul>
      </div>
      <button id="theme-toggle" type="button" class="button-secondary">Theme: System</button>
      <button id="profile-chip" type="button" class="chip">Set your profile</button>
    </div>
  </header>

  <main class="layout" id="explore-view">
    <aside class="card col-watchlist" aria-labelledby="watchlist-title">
      <h2 id="watchlist-title">Watchlist</h2>
      <div id="watchlist-root"></div>
      <section id="risk-education" aria-labelledby="risk-education-title"></section>
    </aside>
    <section class="col-company" aria-label="Company">
      <div id="snapshot-root" class="card"></div>
      <div id="earnings-root" class="card"></div>
    </section>
    <aside class="card col-chat" aria-label="Chat">
      <div id="chat-root"></div>
    </aside>
  </main>

  <section id="lab-root" class="lab" aria-labelledby="lab-title" hidden></section>
  <section id="sign-root" class="sign" aria-labelledby="sign-title" hidden></section>
  <section id="brokers-root" class="brokers" aria-labelledby="brokers-title" hidden></section>
  <section id="paper-root" class="paper" aria-labelledby="paper-title" hidden></section>

  <div id="checklist-root"></div>
  <div id="accounts-root"></div>
  <div id="sentiment-root"></div>

  <footer id="disclaimer-footer">This app is for education only. It does not give financial advice. Investing has risk, and you can lose money. Talk to a licensed professional before you make decisions.</footer>
